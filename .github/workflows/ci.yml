name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux linker & build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux linker & build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib
      - run: cargo test -p uno-tools-core -p uno-tools-exec -p uno-voice -p uno-session -p uno-daemon -p uno-mcp

  core-boundary:
    name: core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core must not touch the OS
        run: |
          if grep -rn --include='*.rs' --exclude-dir=tests -E 'std::fs|std::process::Command' \
            crates/core/uno-protocol crates/core/uno-provider crates/core/uno-harness crates/core/uno-session \
            crates/tools/uno-tools-core crates/tools/uno-tools-browser crates/core/uno-transport \
            crates/providers/uno-provider-openai crates/providers/uno-provider-anthropic \
            crates/providers/uno-provider-copilot crates/providers/uno-provider-antigravity; then
            echo "core crates must not access the filesystem or spawn processes"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p uno-protocol -p uno-session -p uno-voice

  cross-targets:
    name: cross check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - aarch64-apple-ios
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p uno-protocol -p uno-session --target ${{ matrix.target }}

  daemon-platforms:
    name: uno-daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p uno-daemon --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bnjbvr/cargo-machete@v0.10.1
