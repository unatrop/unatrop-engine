syntax = "proto3";

package uno.daemon.v1;

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_DENY = 1;
  APPROVAL_DECISION_ALLOW_ONCE = 2;
  APPROVAL_DECISION_ALWAYS_ALLOW = 3;
}

enum ApprovalMode {
  APPROVAL_MODE_UNSPECIFIED = 0;
  APPROVAL_MODE_DEFAULT = 1;
  APPROVAL_MODE_READ_ONLY = 2;
  APPROVAL_MODE_AUTO_APPROVE_WORKSPACE = 3;
  APPROVAL_MODE_FULL_AUTO = 4;
}

enum ThinkingLevel {
  THINKING_LEVEL_UNSPECIFIED = 0;
  THINKING_LEVEL_OFF = 1;
  THINKING_LEVEL_MINIMAL = 2;
  THINKING_LEVEL_LOW = 3;
  THINKING_LEVEL_MEDIUM = 4;
  THINKING_LEVEL_HIGH = 5;
  THINKING_LEVEL_XHIGH = 6;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_WAITING_FOR_MODEL = 1;
  RUN_STATE_STREAMING_RESPONSE = 2;
  RUN_STATE_HANDLING_TOOL_CALLS = 3;
  RUN_STATE_COMPLETED = 4;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;
  FINISH_REASON_TOOL_CALL = 2;
  FINISH_REASON_LENGTH = 3;
  FINISH_REASON_CONTENT_FILTER = 4;
  FINISH_REASON_OTHER = 5;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_DEVELOPER = 2;
  ROLE_USER = 3;
  ROLE_ASSISTANT = 4;
  ROLE_TOOL = 5;
}

enum PlanStepStatus {
  PLAN_STEP_STATUS_UNSPECIFIED = 0;
  PLAN_STEP_STATUS_PENDING = 1;
  PLAN_STEP_STATUS_IN_PROGRESS = 2;
  PLAN_STEP_STATUS_COMPLETED = 3;
}

message Empty {}

message ContextProfile {
  uint64 max_input_tokens = 1;
  uint64 max_output_tokens = 2;
  uint64 compact_at_tokens = 3;
}

message PlanStep {
  string step = 1;
  PlanStepStatus status = 2;
}
