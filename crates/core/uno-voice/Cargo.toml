[package]
name = "uno-voice"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["transcribe"]
transcribe = ["dep:transcribe-rs", "dep:ort", "dep:reqwest", "dep:futures-util", "dep:tracing", "dep:ring"]
alice-tts = ["dep:reqwest", "dep:futures-util"]

[dependencies]
async-trait = { workspace = true }
nnnoiseless = "0.5"
ring = { version = "0.17", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true, optional = true }

ort = { version = "2.0.0-rc.12", default-features = false, optional = true }
transcribe-rs = { version = "0.3.12", features = ["onnx"], optional = true }
reqwest = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[[example]]
name = "alice_say"
required-features = ["alice-tts"]

[lints]
workspace = true
