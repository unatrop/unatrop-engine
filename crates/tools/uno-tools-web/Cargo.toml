serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
transport = { package = "uno-transport", path = "../../core/uno-transport" }
uno-tools-core = { path = "../uno-tools-core" }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }